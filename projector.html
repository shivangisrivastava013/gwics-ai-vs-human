<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=index.html?mode=presentation">
  <title>Redirecting to Presentation Stage...</title>
  <link rel="canonical" href="index.html?mode=presentation">
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      let target = "index.html?mode=presentation";
      const room = params.get("room");
      if (room) {
        target += "&room=" + encodeURIComponent(room);
      }
      for (const [k, v] of params.entries()) {
        if (k !== "room" && k !== "mode") {
          target += "&" + encodeURIComponent(k) + "=" + encodeURIComponent(v);
        }
      }
      window.location.replace(target);
    })();
  </script>
  <style>
    body {
      background: #07090D;
      color: #F8FAFC;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    a {
      color: #E5B842;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <p>Connecting to <a href="index.html?mode=presentation">Audience Presentation Stage</a>...</p>
</body>
</html>
